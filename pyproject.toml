[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "md-formatter"
version = "0.1.0"
description = "Convert Notion Markdown exports into branded PDFs"
requires-python = ">=3.10"
dependencies = ["weasyprint>=62", "markdown-it-py>=3", "mdit-py-plugins>=0.4"]

[project.scripts]
md2pdf = "md_formatter.cli:main"

[tool.uv.build-backend]
module-name = "md_formatter"
module-root = ""
