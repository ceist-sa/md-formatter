[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-formatter"
version = "0.1.0"
description = "Convert Notion Markdown exports into branded PDFs"
requires-python = ">=3.10"
dependencies = ["weasyprint>=62", "markdown-it-py>=3", "mdit-py-plugins>=0.4"]

[project.scripts]
md2pdf = "md_formatter.cli:main"

[tool.setuptools]
packages = ["md_formatter"]

[tool.setuptools.package-data]
md_formatter = ["style.css", "assets/*.png", "assets/fonts/*.ttf"]
